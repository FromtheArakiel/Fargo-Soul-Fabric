plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = "${project.mod_id}-${project.minecraft_version}-fabric"
}

// The two mods this port compiles against are shipped as local jars in libs/:
// the Curios Fabric port and GeckoLib (the summons are GeoAnimatable).
def localMod = { String name -> files("libs/${name}") }

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation localMod(project.curios_jar)
	modImplementation localMod(project.geckolib_jar)
}

loom {
	// The client only code lives in src/client/java; a dedicated server never sees it.
	splitEnvironmentSourceSets()

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	accessWidenerPath = file("src/main/resources/fargosoulfabric.accesswidener")
}

processResources {
	def props = [
			version          : project.mod_version,
			minecraft_version: project.minecraft_version,
			mod_id           : project.mod_id,
			mod_name         : project.mod_name,
			mod_description  : project.mod_description,
			mod_authors      : project.mod_authors,
			mod_license      : project.mod_license
	]
	inputs.properties props

	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

// The port is kept warning free. The classfile checks are off: they only report missing
// annotation classes of the bundled libraries (Guava and friends), not problems of this mod.
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-Xlint:all', '-Xlint:-serial', '-Xlint:-classfile']
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}

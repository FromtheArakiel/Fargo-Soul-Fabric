# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Fabric Properties
minecraft_version=1.21.1
loader_version=0.19.5
# The Loom line the other local Fabric builds use; it needs a Java 25 build JVM
# (see gradle/gradle-daemon-jvm.properties). The mod itself targets Java 21.
loom_version=1.18-SNAPSHOT

# Mod Properties
mod_id=fargosoulfabric
mod_name=Fargo Soul
mod_description=
mod_authors=First-Sight (original), FromtheArakiel (Fabric port)
mod_license=GPL-3.0-or-later
mod_version=1.21.1.3
maven_group=dev.arakiel.fargosoulfabric

# Dependencies
fabric_api_version=0.116.17+1.21.1
# Jar in libs/, built by the Curios Fabric port.
curios_jar=curiosfabric-fabric-1.21.1-9.5.1+1.21.1.jar
# Jar in libs/, the animation library the summons are built on.
geckolib_jar=geckolib-fabric-1.21.1-4.9.3.jar
